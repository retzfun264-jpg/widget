<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

:root {
  --midnight: #0D1117;
  --surface: #191E25;
  --surface-2: #20262E;
  --input: #12171D;

  --text: #F5F7FA;
  --muted: #89929D;

  --ember: #FF6B35;
  --pink: #FF4F81;
  --purple: #8B5CF6;
  --blue: #4F8CFF;
  --cyan: #42D9FF;

  --border: rgba(255,255,255,.085);
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  padding: 12px;
  background: var(--midnight);
  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

/* =========================
   WIDGET
========================= */

.widget {
  width: 100%;
  max-width: 960px;
  margin: auto;

  position: relative;
  overflow: hidden;

  padding: clamp(17px, 3vw, 28px);

  border: 1px solid var(--border);
  border-radius: 24px;

  background:
    radial-gradient(
      circle at 85% 5%,
      rgba(255,107,53,.055),
      transparent 30%
    ),
    radial-gradient(
      circle at 10% 100%,
      rgba(79,140,255,.045),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #1D2229,
      #191E25 48%,
      #161B21
    );

  box-shadow:
    0 25px 70px rgba(0,0,0,.32),
    inset 0 1px 0 rgba(255,255,255,.035);
}

/* subtil reflet supérieur */

.widget::before {
  content: "";

  position: absolute;
  top: 0;
  left: 12%;
  right: 12%;

  height: 1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.18),
      transparent
    );

  pointer-events: none;
}

/* =========================
   HEADER
========================= */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;

  margin-bottom: 20px;
}

.eyebrow {
  margin-bottom: 5px;

  font-size: 10px;
  font-weight: 800;

  letter-spacing: .16em;
  text-transform: uppercase;

  background:
    linear-gradient(
      90deg,
      var(--ember),
      var(--pink)
    );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

h1 {
  margin: 0;

  font-size: clamp(21px, 3vw, 27px);
  line-height: 1;

  letter-spacing: -.045em;
}

.subtitle {
  margin-top: 7px;

  color: var(--muted);

  font-size: 12px;
}

/* =========================
   GLASS BUTTON
========================= */

.settings-button {
  flex-shrink: 0;

  height: 38px;
  padding: 0 14px;

  border: 1px solid rgba(255,255,255,.09);
  border-radius: 12px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.025)
    );

  color: #CDD4DC;

  font-size: 12px;
  font-weight: 650;

  cursor: pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045);

  transition:
    .2s ease;
}

.settings-button:hover {
  border-color: rgba(255,255,255,.16);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  transform: translateY(-1px);
}

/* =========================
   SETTINGS
========================= */

.settings {
  overflow: hidden;

  max-height: 0;
  opacity: 0;

  transition:
    max-height .4s cubic-bezier(.2,.8,.2,1),
    opacity .25s ease,
    margin .4s ease;
}

.settings.open {
  max-height: 600px;
  opacity: 1;

  margin-bottom: 18px;
}

.settings-inner {
  padding: 16px;

  border: 1px solid rgba(255,255,255,.07);
  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.012)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);
}

.form {
  display: grid;

  grid-template-columns:
    repeat(3, minmax(0, 1fr));

  gap: 12px;
}

label {
  display: block;

  margin-bottom: 7px;

  color: #AEB7C1;

  font-size: 11px;
  font-weight: 650;
}

input,
select {
  width: 100%;
  height: 42px;

  padding: 0 12px;

  border: 1px solid rgba(255,255,255,.065);
  border-radius: 11px;

  outline: none;

  background:
    linear-gradient(
      145deg,
      #14191F,
      #11161C
    );

  color: var(--text);

  font-size: 13px;

  transition: .2s ease;
}

input:focus,
select:focus {
  border-color: rgba(255,107,53,.5);

  box-shadow:
    0 0 0 3px rgba(255,107,53,.07);
}

.calculate {
  width: 100%;
  height: 43px;

  margin-top: 14px;

  border: 0;
  border-radius: 11px;

  color: white;

  font-size: 12px;
  font-weight: 750;

  cursor: pointer;

  background:
    linear-gradient(
      105deg,
      #FF6B35,
      #FF5F68 42%,
      #C968FF 100%
    );

  box-shadow:
    0 8px 25px rgba(255,107,53,.13),
    inset 0 1px 0 rgba(255,255,255,.2);

  transition: .2s ease;
}

.calculate:hover {
  transform: translateY(-1px);

  filter: brightness(1.06);

  box-shadow:
    0 12px 30px rgba(255,107,53,.19),
    inset 0 1px 0 rgba(255,255,255,.2);
}

/* =========================
   RESULTS
========================= */

.results {
  display: grid;

  grid-template-columns:
    minmax(250px,.95fr)
    minmax(300px,1.05fr);

  gap: 16px;
}

/* =========================
   CALORIE CARD
========================= */

.calorie-card {
  position: relative;

  min-height: 330px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.075);
  border-radius: 20px;

  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(255,255,255,.035),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      #1D2229,
      #181D23
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);
}

/* glow très léger */

.calorie-card::before {
  content: "";

  position: absolute;

  width: 230px;
  height: 230px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(139,92,246,.07),
      transparent 68%
    );

  filter: blur(15px);
}

/* =========================
   MAIN RING
========================= */

.main-ring {
  position: relative;

  width: clamp(205px, 29vw, 250px);
  aspect-ratio: 1;

  display: grid;
  place-items: center;
}

.main-ring svg {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  transform: rotate(-90deg);
}

/* cercle de fond */

.ring-background {
  fill: none;

  stroke: rgba(255,255,255,.075);

  stroke-width: 9;
}

/* halo */

.ring-glow {
  fill: none;

  stroke: url(#multiGradient);

  stroke-width: 15;

  opacity: .13;

  filter: blur(7px);
}

/* vrai cercle */

.ring-progress {
  fill: none;

  stroke: url(#multiGradient);

  stroke-width: 9;

  stroke-linecap: round;

  stroke-dasharray: 565;
  stroke-dashoffset: 565;

  transition:
    stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1);
}

/* =========================
   CENTER
========================= */

.ring-content {
  position: relative;

  text-align: center;
}

.ring-label {
  color: #8F98A3;

  font-size: 9px;
  font-weight: 700;

  letter-spacing: .12em;
  text-transform: uppercase;
}

.calories {
  margin-top: 5px;

  font-size: clamp(34px, 5vw, 46px);
  font-weight: 850;

  letter-spacing: -.065em;

  background:
    linear-gradient(
      115deg,
      #FF6B35,
      #FF4F81 40%,
      #9D6BFF 80%,
      #62A0FF
    );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.kcal {
  margin-top: 4px;

  color: #69737E;

  font-size: 10px;
}

/* =========================
   MACROS
========================= */

.macro-section {
  display: flex;
  flex-direction: column;
  justify-content: center;

  gap: 10px;
}

.macro-card {
  position: relative;

  display: grid;

  grid-template-columns: 58px 1fr auto;

  align-items: center;

  gap: 13px;

  min-height: 96px;

  padding: 14px 16px;

  overflow: hidden;

  border: 1px solid rgba(255,255,255,.065);
  border-radius: 17px;

  background:
    linear-gradient(
      145deg,
      #1E242C,
      #191E25
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);

  transition:
    transform .2s ease,
    border-color .2s ease;
}

.macro-card:hover {
  transform: translateY(-1px);

  border-color:
    rgba(255,255,255,.11);
}

/* petite lumière interne */

.macro-card::after {
  content: "";

  position: absolute;

  right: -35px;
  top: -50px;

  width: 110px;
  height: 110px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      var(--macro-color),
      transparent 68%
    );

  opacity: .045;
}

/* =========================
   MACRO RING
========================= */

.macro-ring {
  position: relative;

  width: 56px;
  height: 56px;
}

.macro-ring svg {
  width: 100%;
  height: 100%;

  transform: rotate(-90deg);
}

.macro-bg {
  fill: none;

  stroke: rgba(255,255,255,.075);

  stroke-width: 5;
}

.macro-progress {
  fill: none;

  stroke: var(--macro-color);

  stroke-width: 5;

  stroke-linecap: round;

  stroke-dasharray: 138;
  stroke-dashoffset: 138;

  transition:
    stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);
}

.protein {
  --macro-color: #FF6B35;
}

.carbs {
  --macro-color: #F2C94C;
}

.fat {
  --macro-color: #6C8CFF;
}

/* =========================
   MACRO TEXT
========================= */

.macro-name {
  color: #D3D9E0;

  font-size: 12px;
  font-weight: 720;
}

.macro-description {
  margin-top: 4px;

  color: #737D88;

  font-size: 10px;
}

.macro-value {
  color: #F1F4F7;

  font-size: 21px;
  font-weight: 820;

  letter-spacing: -.04em;

  white-space: nowrap;
}

.macro-value span {
  color: #737D88;

  font-size: 10px;
  font-weight: 550;
}

/* =========================
   FOOTER
========================= */

.footer {
  margin-top: 13px;

  color: #626C77;

  font-size: 9px;
  line-height: 1.5;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 720px) {

  .results {
    grid-template-columns: 1fr;
  }

  .calorie-card {
    min-height: 280px;
  }

  .form {
    grid-template-columns:
      repeat(2, minmax(0,1fr));
  }
}

@media (max-width: 480px) {

  body {
    padding: 7px;
  }

  .widget {
    padding: 14px;
    border-radius: 19px;
  }

  .subtitle {
    display: none;
  }

  .form {
    grid-template-columns: 1fr;
  }

  .macro-card {
    grid-template-columns: 53px 1fr auto;
  }

  .macro-ring {
    width: 53px;
    height: 53px;
  }
}
</style>
</head>

<body>

<div class="widget">

  <!-- HEADER -->

  <div class="header">

    <div>
      <div class="eyebrow">
        Nutrition
      </div>

      <h1>
        Calorie Calculator
      </h1>

      <div class="subtitle">
        Tes besoins quotidiens, sans prise de tête.
      </div>
    </div>

    <button
      class="settings-button"
      id="settingsButton"
      onclick="toggleSettings()"
    >
      Paramètres
    </button>

  </div>


  <!-- SETTINGS -->

  <div
    class="settings"
    id="settings"
  >

    <div class="settings-inner">

      <div class="form">

        <div>
          <label>Âge</label>

          <input
            id="age"
            type="number"
            placeholder="25"
            min="13"
            max="100"
          >
        </div>

        <div>
          <label>Sexe</label>

          <select id="sex">
            <option value="male">Homme</option>
            <option value="female">Femme</option>
          </select>
        </div>

        <div>
          <label>Taille</label>

          <input
            id="height"
            type="number"
            placeholder="180"
          >
        </div>

        <div>
          <label>Poids</label>

          <input
            id="weight"
            type="number"
            placeholder="75"
            step=".1"
          >
        </div>

        <div>
          <label>Activité</label>

          <select id="activity">

            <option value="1.2">
              Sédentaire
            </option>

            <option value="1.375">
              Légèrement actif
            </option>

            <option value="1.55" selected>
              Modérément actif
            </option>

            <option value="1.725">
              Très actif
            </option>

            <option value="1.9">
              Extrêmement actif
            </option>

          </select>
        </div>

        <div>
          <label>Objectif</label>

          <select id="goal">

            <option value="-0.2">
              Perte
            </option>

            <option value="0" selected>
              Maintien
            </option>

            <option value=".1">
              Prise de masse
            </option>

          </select>
        </div>

      </div>

      <button
        class="calculate"
        onclick="calculate()"
      >
        Calculer mes besoins
      </button>

    </div>

  </div>


  <!-- RESULTS -->

  <div class="results">

    <!-- CALORIES -->

    <div class="calorie-card">

      <div class="main-ring">

        <svg viewBox="0 0 200 200">

          <defs>

            <linearGradient
              id="multiGradient"
              x1="0%"
              y1="0%"
              x2="100%"
              y2="100%"
            >

              <stop
                offset="0%"
                stop-color="#FF6B35"
              />

              <stop
                offset="28%"
                stop-color="#FF4F81"
              />

              <stop
                offset="52%"
                stop-color="#8B5CF6"
              />

              <stop
                offset="76%"
                stop-color="#4F8CFF"
              />

              <stop
                offset="100%"
                stop-color="#42D9FF"
              />

            </linearGradient>

          </defs>

          <circle
            class="ring-background"
            cx="100"
            cy="100"
            r="90"
          />

          <circle
            class="ring-glow"
            cx="100"
            cy="100"
            r="90"
          />

          <circle
            class="ring-progress"
            id="calorieRing"
            cx="100"
            cy="100"
            r="90"
          />

        </svg>

        <div class="ring-content">

          <div class="ring-label">
            Besoin quotidien
          </div>

          <div class="calories">
            <span id="calories">—</span>
          </div>

          <div class="kcal">
            kcal / jour
          </div>

        </div>

      </div>

    </div>


    <!-- MACROS -->

    <div class="macro-section">

      <div
        class="macro-card protein"
      >

        <div class="macro-ring">

          <svg viewBox="0 0 56 56">

            <circle
              class="macro-bg"
              cx="28"
              cy="28"
              r="22"
            />

            <circle
              class="macro-progress"
              id="proteinRing"
              cx="28"
              cy="28"
              r="22"
            />

          </svg>

        </div>

        <div>

          <div class="macro-name">
            Protéines
          </div>

          <div class="macro-description">
            Construction musculaire
          </div>

        </div>

        <div class="macro-value">
          <span id="protein">—</span>
          <span>g</span>
        </div>

      </div>


      <div
        class="macro-card carbs"
      >

        <div class="macro-ring">

          <svg viewBox="0 0 56 56">

            <circle
              class="macro-bg"
              cx="28"
              cy="28"
              r="22"
            />

            <circle
              class="macro-progress"
              id="carbsRing"
              cx="28"
              cy="28"
              r="22"
            />

          </svg>

        </div>

        <div>

          <div class="macro-name">
            Glucides
          </div>

          <div class="macro-description">
            Énergie quotidienne
          </div>

        </div>

        <div class="macro-value">
          <span id="carbs">—</span>
          <span>g</span>
        </div>

      </div>


      <div
        class="macro-card fat"
      >

        <div class="macro-ring">

          <svg viewBox="0 0 56 56">

            <circle
              class="macro-bg"
              cx="28"
              cy="28"
              r="22"
            />

            <circle
              class="macro-progress"
              id="fatRing"
              cx="28"
              cy="28"
              r="22"
            />

          </svg>

        </div>

        <div>

          <div class="macro-name">
            Lipides
          </div>

          <div class="macro-description">
            Hormones & fonctions
          </div>

        </div>

        <div class="macro-value">
          <span id="fat">—</span>
          <span>g</span>
        </div>

      </div>

    </div>

  </div>


  <div class="footer">
    Estimation basée sur Mifflin-St Jeor. Les besoins réels peuvent varier.
  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

function toggleSettings() {

  const settings =
    document.getElementById("settings");

  const button =
    document.getElementById("settingsButton");

  const open =
    settings.classList.toggle("open");

  button.textContent =
    open
      ? "Fermer"
      : "Paramètres";
}


/* =========================
   CALCUL
========================= */

function calculate() {

  const age =
    Number(
      document.getElementById("age").value
    );

  const height =
    Number(
      document.getElementById("height").value
    );

  const weight =
    Number(
      document.getElementById("weight").value
    );

  const sex =
    document.getElementById("sex").value;

  const activity =
    Number(
      document.getElementById("activity").value
    );

  const goal =
    Number(
      document.getElementById("goal").value
    );


  if (!age || !height || !weight) {

    alert(
      "Remplis tous les paramètres."
    );

    return;
  }


  /* Mifflin-St Jeor */

  let bmr;

  if (sex === "male") {

    bmr =
      (10 * weight) +
      (6.25 * height) -
      (5 * age) +
      5;

  } else {

    bmr =
      (10 * weight) +
      (6.25 * height) -
      (5 * age) -
      161;
  }


  const tdee =
    bmr * activity;

  const calories =
    Math.round(
      tdee * (1 + goal)
    );


  /* MACROS */

  const protein =
    Math.round(weight * 2);

  const fat =
    Math.round(weight * .8);

  const proteinCalories =
    protein * 4;

  const fatCalories =
    fat * 9;

  const carbs =
    Math.max(
      0,
      Math.round(
        (
          calories -
          proteinCalories -
          fatCalories
        ) / 4
      )
    );


  /* TEXT */

  document.getElementById(
    "calories"
  ).textContent =
    calories.toLocaleString("fr-FR");

  document.getElementById(
    "protein"
  ).textContent =
    protein;

  document.getElementById(
    "carbs"
  ).textContent =
    carbs;

  document.getElementById(
    "fat"
  ).textContent =
    fat;


  /* MAIN RING */

  const calorieProgress =
    Math.min(
      calories / 3500,
      1
    );

  setRing(
    "calorieRing",
    calorieProgress,
    565
  );


  /* MACRO PERCENTAGES */

  const total =
    proteinCalories +
    (carbs * 4) +
    fatCalories;


  setRing(
    "proteinRing",
    proteinCalories / total,
    138
  );

  setRing(
    "carbsRing",
    (carbs * 4) / total,
    138
  );

  setRing(
    "fatRing",
    fatCalories / total,
    138
  );
}


/* =========================
   RING
========================= */

function setRing(
  id,
  percent,
  circumference
) {

  const ring =
    document.getElementById(id);

  const safePercent =
    Math.min(
      Math.max(percent, 0),
      1
    );

  const offset =
    circumference *
    (1 - safePercent);

  requestAnimationFrame(() => {

    ring.style.strokeDashoffset =
      offset;

  });
}


/* =========================
   START
========================= */

/*
 * Paramètres ouverts au premier lancement
 * pour que l'utilisateur comprenne le widget.
 */

toggleSettings();

</script>

</body>
</html>
