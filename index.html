<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie Calculator</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #050505;
  --card: rgba(255,255,255,.055);
  --card-2: rgba(255,255,255,.035);
  --border: rgba(255,255,255,.10);
  --text: #fff;
  --muted: #9a9a9f;

  --purple: #8B5CF6;
  --pink: #EC4899;
  --blue: #3B82F6;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 18px;

  background:
    radial-gradient(
      circle at 20% 20%,
      rgba(139,92,246,.13),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 80%,
      rgba(236,72,153,.08),
      transparent 35%
    ),
    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =========================
   CONTAINER
========================= */

.calculator {
  width: min(700px, 100%);

  border: 1px solid var(--border);
  border-radius: 24px;

  background: var(--card);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  box-shadow:
    0 8px 32px rgba(0,0,0,.37),
    inset 0 1px rgba(255,255,255,.035);

  overflow: hidden;
}


/* =========================
   HEADER
========================= */

.header {
  height: 62px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 22px;

  border-bottom: 1px solid rgba(255,255,255,.06);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-dot {
  width: 9px;
  height: 9px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 0 15px rgba(139,92,246,.7);
}

.title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .8px;
}

.theme-button {
  width: 31px;
  height: 31px;

  display: grid;
  place-items: center;

  padding: 0;

  border: 1px solid var(--border);
  border-radius: 10px;

  color: var(--muted);
  background: rgba(255,255,255,.04);

  cursor: pointer;

  transition: .2s;
}

.theme-button:hover {
  color: white;
  background: rgba(255,255,255,.08);
}


/* =========================
   VIEWS
========================= */

.view {
  padding: 24px;
}

.hidden {
  display: none;
}


/* =========================
   FORM
========================= */

.form-title {
  margin-bottom: 20px;
}

.form-title h2 {
  margin: 0;

  font-size: 20px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.form-title p {
  margin: 6px 0 0;

  color: var(--muted);
  font-size: 11px;
}


.form-grid {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 13px;
}


.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  padding-left: 2px;

  color: #a7a7ad;

  font-size: 10px;
  font-weight: 600;

  letter-spacing: .4px;
}


input,
select {
  width: 100%;
  height: 42px;

  padding: 0 12px;

  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;

  outline: none;

  background: rgba(0,0,0,.38);

  color: white;

  font-family: inherit;
  font-size: 12px;

  transition:
    border .2s,
    box-shadow .2s,
    background .2s;
}

input:hover,
select:hover {
  background: rgba(255,255,255,.045);
}

input:focus,
select:focus {
  border-color: rgba(139,92,246,.7);

  box-shadow:
    0 0 0 3px rgba(139,92,246,.10);
}

select option {
  background: #151515;
}


/* =========================
   CALCULATE
========================= */

.calculate {
  width: 100%;
  height: 44px;

  margin-top: 19px;

  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.17),
      rgba(236,72,153,.12)
    );

  color: white;

  font-family: inherit;
  font-size: 12px;
  font-weight: 700;

  cursor: pointer;

  transition: .25s;
}

.calculate:hover {
  transform: translateY(-1px);

  border-color:
    rgba(139,92,246,.45);

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.3),
      rgba(236,72,153,.2)
    );

  box-shadow:
    0 10px 25px rgba(139,92,246,.12);
}


/* =========================
   RESULT
========================= */

.result-top {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}


/* TABS */

.tabs {
  display: flex;
  gap: 4px;

  padding: 4px;

  border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px;

  background: rgba(0,0,0,.24);
}

.tab {
  border: 0;
  border-radius: 9px;

  padding: 7px 12px;

  color: #77777d;
  background: transparent;

  font-family: inherit;
  font-size: 10px;
  font-weight: 600;

  cursor: pointer;

  transition: .2s;
}

.tab.active {
  color: white;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.8),
      rgba(236,72,153,.7)
    );

  box-shadow:
    0 4px 14px rgba(139,92,246,.18);
}


/* =========================
   RESULT CENTER
========================= */

.result-center {
  display: flex;
  justify-content: center;

  padding: 8px 0 20px;
}

.ring {
  width: 220px;
  height: 220px;

  position: relative;
}

.ring svg {
  width: 100%;
  height: 100%;

  transform: rotate(-90deg);
}

.ring-bg {
  fill: none;

  stroke:
    rgba(255,255,255,.06);

  stroke-width: 11;
}

.ring-progress {
  fill: none;

  stroke: url(#gradient);

  stroke-width: 11;

  stroke-linecap: round;

  stroke-dasharray: 565;

  stroke-dashoffset: 565;

  transition:
    stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1);
}

.ring-content {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  pointer-events: none;
}

.calorie-number {
  font-size: 34px;
  font-weight: 800;

  letter-spacing: -1.8px;
}

.calorie-label {
  margin-top: 2px;

  color: var(--muted);

  font-size: 9px;
  font-weight: 600;

  letter-spacing: 1.4px;
}


/* =========================
   MACROS
========================= */

.macros {
  display: grid;

  grid-template-columns: repeat(3,1fr);

  gap: 9px;
}

.macro {
  padding: 12px;

  border: 1px solid rgba(255,255,255,.065);
  border-radius: 14px;

  background: var(--card-2);
}

.macro-top {
  display: flex;
  align-items: center;
  gap: 6px;

  color: #a2a2a8;

  font-size: 10px;
}

.macro-dot {
  width: 6px;
  height: 6px;

  border-radius: 50%;
}

.carbs {
  background: var(--purple);
}

.protein {
  background: var(--blue);
}

.fats {
  background: var(--pink);
}

.macro-value {
  margin-top: 7px;

  font-size: 19px;
  font-weight: 750;
}

.macro-value span {
  color: #77777e;

  font-size: 9px;
  font-weight: 500;
}


/* =========================
   RECALCULATE
========================= */

.recalculate {
  display: block;

  margin: 19px auto 0;

  padding: 0;

  border: 0;

  background: transparent;

  color: #8d8d95;

  font-family: inherit;
  font-size: 10px;

  cursor: pointer;

  transition: .2s;
}

.recalculate:hover {
  color: white;
}


/* =========================
   ANIMATION
========================= */

.view.animate-in {
  animation:
    fadeIn .35s ease both;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(7px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}


/* =========================
   LIGHT MODE
========================= */

body.light {
  --bg: #eeeeF2;
  --card: rgba(255,255,255,.68);
  --card-2: rgba(255,255,255,.55);

  --border: rgba(0,0,0,.08);

  --text: #111;
  --muted: #707078;
}

body.light input,
body.light select {
  color: #111;
  background: rgba(255,255,255,.7);
}

body.light .ring-content {
  color: #111;
}

body.light .ring-bg {
  stroke: rgba(0,0,0,.08);
}

body.light .tab:not(.active) {
  color: #777;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px) {

  body {
    padding: 10px;
  }

  .calculator {
    border-radius: 20px;
  }

  .view {
    padding: 18px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .ring {
    width: 190px;
    height: 190px;
  }

  .calorie-number {
    font-size: 30px;
  }

  .tabs {
    width: 100%;
  }

  .tab {
    flex: 1;
    padding-left: 6px;
    padding-right: 6px;
  }

  .macros {
    gap: 6px;
  }

  .macro {
    padding: 10px;
  }

  .macro-value {
    font-size: 16px;
  }
}
</style>
</head>


<body>

<div class="calculator">


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="brand">

    <div class="brand-dot"></div>

    <div class="title">
      CALORIE CALCULATOR
    </div>

  </div>

  <button
    class="theme-button"
    id="themeButton"
    aria-label="Toggle theme">

    ☼

  </button>

</header>



<!-- =========================
     FORM VIEW
========================= -->

<section
  class="view"
  id="formView">

  <div class="form-title">

    <h2>
      Your information
    </h2>

    <p>
      Enter your details to calculate your daily needs.
    </p>

  </div>


  <div class="form-grid">


    <div class="field">

      <label>
        GENDER
      </label>

      <select id="gender">

        <option value="male">
          Male
        </option>

        <option value="female">
          Female
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        AGE
      </label>

      <input
        id="age"
        type="number"
        min="13"
        max="100"
        value="21">

    </div>


    <div class="field">

      <label>
        WEIGHT
      </label>

      <input
        id="weight"
        type="number"
        min="30"
        max="300"
        value="80">

    </div>


    <div class="field">

      <label>
        HEIGHT
      </label>

      <input
        id="height"
        type="number"
        min="120"
        max="230"
        value="185">

    </div>


    <div class="field full">

      <label>
        ACTIVITY LEVEL
      </label>

      <select id="activity">

        <option value="1.2">
          Sedentary
        </option>

        <option value="1.375">
          Light (1-3 days/wk)
        </option>

        <option
          value="1.55"
          selected>

          Moderate (3-5 days/wk)

        </option>

        <option value="1.725">
          High (6-7 days/wk)
        </option>

        <option value="1.9">
          Very high
        </option>

      </select>

    </div>

  </div>


  <button
    class="calculate"
    id="calculate">

    Calculate

  </button>

</section>



<!-- =========================
     RESULT VIEW
========================= -->

<section
  class="view hidden"
  id="resultView">


  <div class="result-top">

    <div class="tabs">

      <button
        class="tab"
        data-mode="loss">

        Loss

      </button>

      <button
        class="tab active"
        data-mode="maintain">

        Maintain

      </button>

      <button
        class="tab"
        data-mode="gain">

        Gain

      </button>

    </div>

  </div>


  <div class="result-center">

    <div class="ring">

      <svg viewBox="0 0 200 200">

        <defs>

          <linearGradient
            id="gradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop
              offset="0%"
              stop-color="#8B5CF6"/>

            <stop
              offset="100%"
              stop-color="#EC4899"/>

          </linearGradient>

        </defs>


        <circle
          class="ring-bg"
          cx="100"
          cy="100"
          r="90"/>


        <circle
          class="ring-progress"
          id="ringProgress"
          cx="100"
          cy="100"
          r="90"/>

      </svg>


      <div class="ring-content">

        <div
          class="calorie-number"
          id="calorieNumber">

          2,877

        </div>

        <div class="calorie-label">
          KCAL
        </div>

      </div>

    </div>

  </div>


  <div class="macros">


    <div class="macro">

      <div class="macro-top">

        <div class="macro-dot carbs"></div>

        Carbs

      </div>

      <div class="macro-value">

        <span id="carbs">
          288
        </span>

        <span>g</span>

      </div>

    </div>


    <div class="macro">

      <div class="macro-top">

        <div class="macro-dot protein"></div>

        Protein

      </div>

      <div class="macro-value">

        <span id="protein">
          216
        </span>

        <span>g</span>

      </div>

    </div>


    <div class="macro">

      <div class="macro-top">

        <div class="macro-dot fats"></div>

        Fats

      </div>

      <div class="macro-value">

        <span id="fats">
          96
        </span>

        <span>g</span>

      </div>

    </div>

  </div>


  <button
    class="recalculate"
    id="recalculate">

    Recalculate

  </button>

</section>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const formView =
  document.getElementById("formView");

const resultView =
  document.getElementById("resultView");

const calculateButton =
  document.getElementById("calculate");

const recalculateButton =
  document.getElementById("recalculate");

const ring =
  document.getElementById("ringProgress");


/* =========================
   CALCULATE
========================= */

function calculateCalories(mode = "maintain") {

  const gender =
    document.getElementById("gender").value;

  const age =
    Number(document.getElementById("age").value);

  const weight =
    Number(document.getElementById("weight").value);

  const height =
    Number(document.getElementById("height").value);

  const activity =
    Number(document.getElementById("activity").value);


  if (
    !age ||
    !weight ||
    !height
  ) {
    return null;
  }


  /*
   * Mifflin-St Jeor
   */

  let bmr =
    (10 * weight) +
    (6.25 * height) -
    (5 * age);


  bmr +=
    gender === "male"
      ? 5
      : -161;


  const maintenance =
    bmr * activity;


  let calories;

  if (mode === "loss") {

    calories =
      maintenance * 0.80;

  }

  else if (mode === "gain") {

    calories =
      maintenance * 1.12;

  }

  else {

    calories =
      maintenance;

  }


  /*
   * Macros
   */

  const protein =
    weight * 2.7;

  const fat =
    (calories * 0.30) / 9;

  const carbs =
    Math.max(
      0,
      (calories -
       protein * 4 -
       fat * 9) / 4
    );


  return {
    calories,
    protein,
    carbs,
    fat
  };

}


/* =========================
   UPDATE RESULT
========================= */

function updateResult(mode) {

  const data =
    calculateCalories(mode);

  if (!data) return;


  document.getElementById(
    "calorieNumber"
  ).textContent =
    Math.round(data.calories)
      .toLocaleString("en-US");


  document.getElementById(
    "protein"
  ).textContent =
    Math.round(data.protein);


  document.getElementById(
    "carbs"
  ).textContent =
    Math.round(data.carbs);


  document.getElementById(
    "fats"
  ).textContent =
    Math.round(data.fat);


  /*
   * Animate ring
   */

  const circumference =
    2 * Math.PI * 90;

  const percentage =
    Math.min(
      data.calories / 3500,
      1
    );

  const offset =
    circumference -
    (circumference * percentage);


  ring.style.strokeDasharray =
    circumference;

  ring.style.strokeDashoffset =
    circumference;


  requestAnimationFrame(() => {

    ring.style.strokeDashoffset =
      offset;

  });

}


/* =========================
   SHOW RESULT
========================= */

calculateButton.addEventListener(
  "click",
  () => {

    updateResult("maintain");


    formView.classList.add(
      "hidden"
    );

    resultView.classList.remove(
      "hidden"
    );

    resultView.classList.add(
      "animate-in"
    );

  }
);


/* =========================
   RECALCULATE
========================= */

recalculateButton.addEventListener(
  "click",
  () => {

    resultView.classList.add(
      "hidden"
    );

    formView.classList.remove(
      "hidden"
    );

    formView.classList.add(
      "animate-in"
    );

  }
);


/* =========================
   TABS
========================= */

document
  .querySelectorAll(".tab")
  .forEach(tab => {

    tab.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(t =>
            t.classList.remove("active")
          );


        tab.classList.add("active");


        updateResult(
          tab.dataset.mode
        );

      }
    );

  });


/* =========================
   THEME
========================= */

document
  .getElementById("themeButton")
  .addEventListener(
    "click",
    () => {

      document.body.classList.toggle(
        "light"
      );

    }
  );

</script>

</body>
</html>
