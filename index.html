<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --midnight: #0D1117;
    --surface: #181D24;
    --surface-2: #1D232B;
    --border: #292F38;

    --text: #F0F6FC;
    --muted: #8B949E;

    --ember: #FF6B35;
    --ember-light: #FF8A5B;

    --radius: 18px;
  }

  body {
    margin: 0;
    padding: 16px;
    background: var(--midnight);
    color: var(--text);

    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;

    min-width: 280px;
  }

  .calculator {
    width: 100%;
    max-width: 900px;
    margin: auto;

    background:
      linear-gradient(
        145deg,
        #1B2028 0%,
        #171C23 45%,
        #151A21 100%
      );

    border: 1px solid var(--border);
    border-radius: var(--radius);

    padding: clamp(18px, 3vw, 28px);

    box-shadow:
      0 14px 35px rgba(0, 0, 0, 0.22);
  }

  /* HEADER */

  .header {
    margin-bottom: 24px;
  }

  .eyebrow {
    color: var(--ember);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    margin: 0;
    font-size: clamp(21px, 3vw, 27px);
    letter-spacing: -0.03em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }

  /* FORM */

  .form {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .field.full {
    grid-column: 1 / -1;
  }

  label {
    color: #B8C0CA;
    font-size: 12px;
    font-weight: 600;
  }

  input,
  select {
    width: 100%;
    height: 44px;

    border: 1px solid var(--border);
    border-radius: 11px;

    background: #11161C;
    color: var(--text);

    padding: 0 13px;

    font-size: 14px;
    outline: none;

    transition:
      border-color 0.18s ease,
      box-shadow 0.18s ease,
      background 0.18s ease;
  }

  input:focus,
  select:focus {
    border-color: rgba(255, 107, 53, 0.65);

    box-shadow:
      0 0 0 3px rgba(255, 107, 53, 0.08);

    background: #131920;
  }

  select {
    cursor: pointer;
  }

  /* BUTTON */

  .calculate {
    width: 100%;
    height: 46px;

    margin-top: 18px;

    border: 0;
    border-radius: 12px;

    color: white;
    font-weight: 700;
    font-size: 14px;

    cursor: pointer;

    background:
      linear-gradient(
        120deg,
        #FF6B35 0%,
        #FF7542 45%,
        #FF8A5B 100%
      );

    box-shadow:
      0 7px 20px rgba(255, 107, 53, 0.16);

    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      filter 0.18s ease;
  }

  .calculate:hover {
    transform: translateY(-1px);
    filter: brightness(1.04);

    box-shadow:
      0 10px 25px rgba(255, 107, 53, 0.22);
  }

  .calculate:active {
    transform: translateY(0);
  }

  /* RESULTS */

  .results {
    margin-top: 28px;

    display: none;
  }

  .results.visible {
    display: block;
  }

  .calorie-card {
    position: relative;
    overflow: hidden;

    padding: 22px;

    border-radius: 16px;
    border: 1px solid rgba(255, 107, 53, 0.18);

    background:
      linear-gradient(
        135deg,
        #29201D 0%,
        #211D1D 42%,
        #1B2027 100%
      );
  }

  .calorie-card::after {
    content: "";

    position: absolute;
    width: 180px;
    height: 180px;

    right: -80px;
    top: -90px;

    background:
      radial-gradient(
        circle,
        rgba(255, 107, 53, 0.14),
        transparent 70%
      );

    pointer-events: none;
  }

  .result-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }

  .calories {
    margin-top: 5px;

    font-size: clamp(32px, 6vw, 48px);
    line-height: 1;

    font-weight: 800;
    letter-spacing: -0.05em;

    background:
      linear-gradient(
        120deg,
        #FF6B35,
        #FF9A73
      );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .calorie-unit {
    color: var(--muted);
    font-size: 13px;
    margin-left: 4px;
    letter-spacing: 0;
  }

  /* MACROS */

  .macros {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;

    margin-top: 12px;
  }

  .macro {
    min-width: 0;

    padding: 16px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background:
      linear-gradient(
        145deg,
        #1C222A,
        #171C23
      );
  }

  .macro-name {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .macro-value {
    margin-top: 7px;

    font-size: clamp(20px, 4vw, 27px);
    font-weight: 750;
    letter-spacing: -0.03em;

    white-space: nowrap;
  }

  .macro-unit {
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
  }

  .hint {
    margin-top: 14px;

    color: #707984;
    font-size: 10px;
    line-height: 1.5;
  }

  /* RESPONSIVE */

  @media (max-width: 560px) {
    body {
      padding: 10px;
    }

    .calculator {
      padding: 17px;
    }

    .form {
      grid-template-columns: 1fr;
    }

    .field.full {
      grid-column: auto;
    }

    .macros {
      grid-template-columns: 1fr;
    }

    .macro {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .macro-value {
      margin-top: 0;
    }
  }

  @media (min-width: 760px) {
    .form {
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
    }

    .field.full {
      grid-column: auto;
    }
  }
</style>
</head>

<body>

<div class="calculator">

  <div class="header">
    <div class="eyebrow">Nutrition</div>
    <h1>Calorie Calculator</h1>
    <div class="subtitle">
      Calcule tes besoins quotidiens et tes macros.
    </div>
  </div>

  <div class="form">

    <div class="field">
      <label for="age">Âge</label>
      <input
        id="age"
        type="number"
        min="13"
        max="100"
        placeholder="25"
      >
    </div>

    <div class="field">
      <label for="sex">Sexe</label>
      <select id="sex">
        <option value="male">Homme</option>
        <option value="female">Femme</option>
      </select>
    </div>

    <div class="field">
      <label for="height">Taille</label>
      <input
        id="height"
        type="number"
        min="100"
        max="250"
        placeholder="180"
      >
    </div>

    <div class="field">
      <label for="weight">Poids</label>
      <input
        id="weight"
        type="number"
        min="30"
        max="300"
        step="0.1"
        placeholder="75"
      >
    </div>

    <div class="field">
      <label for="activity">Activité</label>
      <select id="activity">
        <option value="1.2">Sédentaire</option>
        <option value="1.375">Légèrement actif</option>
        <option value="1.55" selected>Modérément actif</option>
        <option value="1.725">Très actif</option>
        <option value="1.9">Extrêmement actif</option>
      </select>
    </div>

    <div class="field">
      <label for="goal">Objectif</label>
      <select id="goal">
        <option value="-0.20">Perte de poids</option>
        <option value="0" selected>Maintien</option>
        <option value="0.10">Prise de masse</option>
      </select>
    </div>

  </div>

  <button class="calculate" onclick="calculate()">
    Calculer mes besoins
  </button>

  <div class="results" id="results">

    <div class="calorie-card">

      <div class="result-label">
        Apport calorique quotidien
      </div>

      <div class="calories">
        <span id="calories">0</span>
        <span class="calorie-unit">kcal / jour</span>
      </div>

    </div>

    <div class="macros">

      <div class="macro">
        <div class="macro-name">Protéines</div>

        <div class="macro-value">
          <span id="protein">0</span>
          <span class="macro-unit">g</span>
        </div>
      </div>

      <div class="macro">
        <div class="macro-name">Glucides</div>

        <div class="macro-value">
          <span id="carbs">0</span>
          <span class="macro-unit">g</span>
        </div>
      </div>

      <div class="macro">
        <div class="macro-name">Lipides</div>

        <div class="macro-value">
          <span id="fat">0</span>
          <span class="macro-unit">g</span>
        </div>
      </div>

    </div>

    <div class="hint">
      Estimation basée sur la formule Mifflin-St Jeor.
      Les résultats restent des estimations.
    </div>

  </div>

</div>

<script>
function calculate() {

  const age = Number(document.getElementById("age").value);
  const height = Number(document.getElementById("height").value);
  const weight = Number(document.getElementById("weight").value);

  const sex = document.getElementById("sex").value;
  const activity = Number(document.getElementById("activity").value);
  const goal = Number(document.getElementById("goal").value);

  if (!age || !height || !weight) {
    alert("Remplis tous les paramètres.");
    return;
  }

  /*
   * Mifflin-St Jeor
   */

  let bmr;

  if (sex === "male") {
    bmr =
      (10 * weight) +
      (6.25 * height) -
      (5 * age) +
      5;
  } else {
    bmr =
      (10 * weight) +
      (6.25 * height) -
      (5 * age) -
      161;
  }

  /*
   * TDEE
   */

  const tdee = bmr * activity;

  /*
   * Objectif
   */

  const calories = Math.round(
    tdee * (1 + goal)
  );

  /*
   * Macros
   *
   * Protéines : 2 g / kg
   * Lipides : 0.8 g / kg
   * Glucides : calories restantes
   */

  const protein = Math.round(weight * 2);
  const fat = Math.round(weight * 0.8);

  const proteinCalories = protein * 4;
  const fatCalories = fat * 9;

  const remainingCalories =
    calories -
    proteinCalories -
    fatCalories;

  const carbs = Math.max(
    0,
    Math.round(remainingCalories / 4)
  );

  /*
   * Affichage
   */

  document.getElementById("calories").textContent =
    calories.toLocaleString("fr-FR");

  document.getElementById("protein").textContent =
    protein;

  document.getElementById("carbs").textContent =
    carbs;

  document.getElementById("fat").textContent =
    fat;

  document
    .getElementById("results")
    .classList.add("visible");
}
</script>

</body>
</html>
