<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(90deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#050505] text-white min-h-screen flex items-center justify-center p-6">

    <div class="flex gap-8 max-w-4xl w-full">
        
        <!-- Panneau de Gauche : Saisie -->
        <div class="glass p-8 rounded-3xl w-1/2 shadow-2xl">
            <h2 class="text-xl font-bold mb-6">CALORIE CALCULATOR</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-400 text-sm mb-1">Gender</label>
                    <select class="w-full bg-[#1A1A1A] rounded-xl p-3 border border-white/10 outline-none">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" placeholder="Age" class="bg-[#1A1A1A] rounded-xl p-3 border border-white/10 outline-none">
                    <input type="number" placeholder="Weight (kg)" class="bg-[#1A1A1A] rounded-xl p-3 border border-white/10 outline-none">
                </div>
                <input type="number" placeholder="Height (cm)" class="w-full bg-[#1A1A1A] rounded-xl p-3 border border-white/10 outline-none">
                <select class="w-full bg-[#1A1A1A] rounded-xl p-3 border border-white/10 outline-none">
                    <option>Moderate (3-5 days/wk)</option>
                </select>
                <button class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition">Calculate</button>
            </div>
            <p class="text-[10px] text-gray-500 mt-6">Powered by Templation.io</p>
        </div>

        <!-- Panneau de Droite : Résultat -->
        <div class="glass p-8 rounded-3xl w-1/2 flex flex-col items-center justify-center">
            <div class="flex bg-[#1A1A1A] p-1 rounded-xl mb-8">
                <button class="px-6 py-2 rounded-lg text-sm">Loss</button>
                <button class="px-6 py-2 rounded-lg text-sm bg-gradient-to-r from-violet-500 to-pink-500">Maintain</button>
                <button class="px-6 py-2 rounded-lg text-sm">Gain</button>
            </div>

            <!-- Anneau visuel -->
            <div class="relative w-40 h-40 border-8 border-t-violet-500 border-r-pink-500 border-b-blue-500 border-l-blue-500 rounded-full flex items-center justify-center mb-8">
                <div class="text-center">
                    <div class="text-2xl font-bold">2877</div>
                    <div class="text-xs text-gray-400">KCAL</div>
                </div>
            </div>

            <!-- Macros -->
            <div class="w-full space-y-3">
                <div class="flex justify-between">
                    <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-violet-500 mr-2"></span>Carbs</span>
                    <span>288g</span>
                </div>
                <div class="flex justify-between">
                    <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-blue-500 mr-2"></span>Protein</span>
                    <span>216g</span>
                </div>
                <div class="flex justify-between">
                    <span class="flex items-center"><span class="w-2 h-2 rounded-full bg-pink-500 mr-2"></span>Fats</span>
                    <span>96g</span>
                </div>
            </div>
            <button class="mt-8 text-gray-400 text-sm hover:text-white underline">Recalculate</button>
        </div>

    </div>
</body>
</html>
