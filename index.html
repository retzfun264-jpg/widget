=<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calorie Calculator Pro</title>

<style>
:root{
  --bg:#050505;
  --card:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#92929a;

  --purple:#8B5CF6;
  --pink:#EC4899;
  --blue:#3B82F6;

  --widget-width:520px;
  --radius:22px;
  --glass:15px;
  --scale:1;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:12px;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(139,92,246,.12),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 90%,
      rgba(236,72,153,.08),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* ==================================================
   WIDGET
================================================== */

.widget{
  width:min(
    calc(var(--widget-width) * var(--scale)),
    100%
  );

  border:1px solid var(--border);
  border-radius:var(--radius);

  background:var(--card);

  backdrop-filter:blur(var(--glass));
  -webkit-backdrop-filter:blur(var(--glass));

  box-shadow:
    0 18px 55px rgba(0,0,0,.38),
    inset 0 1px rgba(255,255,255,.035);

  overflow:hidden;

  transition:
    width .3s ease,
    border-radius .3s ease,
    background .3s ease;
}


/* ==================================================
   HEADER
================================================== */

.header{
  height:54px;

  padding:0 17px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:1px solid rgba(255,255,255,.055);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.brand-icon{
  width:8px;
  height:8px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--pink)
    );

  box-shadow:
    0 0 13px rgba(139,92,246,.65);
}

.brand-name{
  font-size:11px;
  font-weight:750;
  letter-spacing:.7px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.icon-button{
  width:28px;
  height:28px;

  display:grid;
  place-items:center;

  padding:0;

  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;

  background:rgba(255,255,255,.035);

  color:#8d8d95;

  cursor:pointer;

  transition:.2s;
}

.icon-button:hover{
  color:white;
  background:rgba(255,255,255,.08);
}


/* ==================================================
   VIEWS
================================================== */

.view{
  padding:18px;

  animation:
    viewIn .28s ease both;
}

.hidden{
  display:none;
}

@keyframes viewIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* ==================================================
   FORM
================================================== */

.heading{
  margin-bottom:15px;
}

.heading h2{
  margin:0;

  font-size:17px;
  font-weight:750;

  letter-spacing:-.5px;
}

.heading p{
  margin:5px 0 0;

  color:var(--muted);

  font-size:10px;
}

.form-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

label{
  padding-left:2px;

  color:#9999a1;

  font-size:8px;
  font-weight:650;

  letter-spacing:.55px;
}

input,
select{
  width:100%;
  height:36px;

  padding:0 10px;

  border:1px solid rgba(255,255,255,.075);
  border-radius:10px;

  outline:none;

  background:rgba(0,0,0,.32);

  color:white;

  font-family:inherit;
  font-size:10px;

  transition:.2s;
}

input:focus,
select:focus{
  border-color:rgba(139,92,246,.65);

  box-shadow:
    0 0 0 3px rgba(139,92,246,.08);
}

select option{
  background:#141414;
}


/* ==================================================
   PRIMARY BUTTON
================================================== */

.primary{
  width:100%;
  height:38px;

  margin-top:13px;

  border:1px solid rgba(139,92,246,.3);
  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.25),
      rgba(236,72,153,.18)
    );

  color:white;

  font-family:inherit;
  font-size:10px;
  font-weight:700;

  cursor:pointer;

  transition:.22s;
}

.primary:hover{
  transform:translateY(-1px);

  border-color:
    rgba(139,92,246,.55);

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.4),
      rgba(236,72,153,.28)
    );

  box-shadow:
    0 9px 24px rgba(139,92,246,.13);
}


/* ==================================================
   RESULT
================================================== */

.result-tabs{
  display:flex;
  justify-content:center;

  margin-bottom:8px;
}

.tabs{
  display:flex;
  gap:3px;

  padding:3px;

  border:1px solid rgba(255,255,255,.06);
  border-radius:10px;

  background:rgba(0,0,0,.25);
}

.tab{
  padding:6px 12px;

  border:0;
  border-radius:8px;

  background:transparent;

  color:#71717a;

  font-family:inherit;
  font-size:9px;
  font-weight:600;

  cursor:pointer;

  transition:.2s;
}

.tab.active{
  color:white;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.85),
      rgba(236,72,153,.72)
    );

  box-shadow:
    0 4px 12px rgba(139,92,246,.16);
}


/* ==================================================
   RING
================================================== */

.ring-wrapper{
  display:flex;
  justify-content:center;

  padding:2px 0 10px;
}

.ring{
  width:170px;
  height:170px;

  position:relative;
}

.ring svg{
  width:100%;
  height:100%;

  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;

  stroke:rgba(255,255,255,.055);

  stroke-width:9;
}

.ring-progress{
  fill:none;

  stroke:url(#ringGradient);

  stroke-width:9;

  stroke-linecap:round;

  transition:
    stroke-dashoffset .85s cubic-bezier(.22,.61,.36,1);
}

.ring-center{
  position:absolute;

  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;
}

.calories{
  font-size:28px;
  font-weight:800;

  letter-spacing:-1.5px;
}

.kcal{
  margin-top:1px;

  color:var(--muted);

  font-size:8px;
  font-weight:650;

  letter-spacing:1.2px;
}


/* ==================================================
   MACROS
================================================== */

.macros{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;
}

.macro{
  padding:10px;

  border:1px solid rgba(255,255,255,.055);
  border-radius:12px;

  background:rgba(255,255,255,.025);
}

.macro-name{
  display:flex;
  align-items:center;
  gap:5px;

  color:#96969e;

  font-size:9px;
}

.dot{
  width:5px;
  height:5px;

  border-radius:50%;
}

.dot.carbs{
  background:var(--purple);
}

.dot.protein{
  background:var(--blue);
}

.dot.fats{
  background:var(--pink);
}

.macro-value{
  margin-top:5px;

  font-size:17px;
  font-weight:750;
}

.macro-value span{
  color:#777780;

  font-size:8px;
  font-weight:500;
}


/* ==================================================
   RESULT ACTIONS
================================================== */

.result-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-top:12px;
}

.action{
  height:36px;

  border-radius:10px;

  font-family:inherit;

  font-size:9px;
  font-weight:650;

  cursor:pointer;

  transition:.2s;
}

.recalculate{
  border:1px solid rgba(139,92,246,.35);

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.22),
      rgba(236,72,153,.14)
    );

  color:white;
}

.recalculate:hover{
  transform:translateY(-1px);

  border-color:
    rgba(139,92,246,.65);

  box-shadow:
    0 8px 20px rgba(139,92,246,.13);
}

.settings-button{
  border:1px solid rgba(255,255,255,.09);

  background:rgba(255,255,255,.045);

  color:#aaaab1;
}

.settings-button:hover{
  color:white;

  background:rgba(255,255,255,.08);
}


/* ==================================================
   SETTINGS
================================================== */

.settings-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:16px;
}

.settings-title h2{
  margin:0;

  font-size:16px;
}

.settings-title span{
  color:var(--muted);

  font-size:9px;
}

.setting{
  padding:12px;

  margin-bottom:8px;

  border:1px solid rgba(255,255,255,.055);
  border-radius:12px;

  background:rgba(255,255,255,.025);
}

.setting-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:9px;
}

.setting-name{
  font-size:10px;
  font-weight:650;
}

.setting-value{
  color:var(--muted);

  font-size:9px;
}

.colors{
  display:flex;
  gap:7px;
}

.color{
  width:25px;
  height:25px;

  padding:0;

  border:2px solid transparent;
  border-radius:8px;

  cursor:pointer;
}

.color.active{
  border-color:white;

  box-shadow:
    0 0 0 2px rgba(255,255,255,.15);
}

.color.purple{
  background:#8B5CF6;
}

.color.pink{
  background:#EC4899;
}

.color.blue{
  background:#3B82F6;
}

.color.green{
  background:#22C55E;
}

.color.orange{
  background:#F97316;
}

.color.cyan{
  background:#06B6D4;
}

.range{
  width:100%;

  accent-color:var(--purple);
}

.settings-actions{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;

  margin-top:12px;
}

.back{
  height:36px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;

  background:rgba(255,255,255,.04);

  color:#aaaab1;

  font-family:inherit;
  font-size:9px;
  font-weight:650;

  cursor:pointer;
}

.save{
  height:36px;

  border:1px solid rgba(139,92,246,.35);
  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.25),
      rgba(236,72,153,.18)
    );

  color:white;

  font-family:inherit;
  font-size:9px;
  font-weight:700;

  cursor:pointer;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:430px){

  body{
    padding:8px;
  }

  .view{
    padding:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .ring{
    width:155px;
    height:155px;
  }

  .calories{
    font-size:25px;
  }

  .tab{
    padding:6px 10px;
  }

}
</style>
</head>


<body>

<div class="widget" id="widget">


<!-- ==================================================
     HEADER
================================================== -->

<header class="header">

  <div class="brand">

    <div class="brand-icon"></div>

    <div class="brand-name">
      CALORIE CALCULATOR
    </div>

  </div>

  <div class="header-actions">

    <button
      class="icon-button"
      id="themeButton"
      title="Theme">

      ☼

    </button>

  </div>

</header>



<!-- ==================================================
     FORM VIEW
================================================== -->

<section
  class="view"
  id="formView">

  <div class="heading">

    <h2>
      Your information
    </h2>

    <p>
      Enter your details to calculate your daily needs.
    </p>

  </div>


  <div class="form-grid">


    <div class="field">

      <label>
        GENDER
      </label>

      <select id="gender">

        <option value="male">
          Male
        </option>

        <option value="female">
          Female
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        AGE
      </label>

      <input
        id="age"
        type="number"
        value="21"
        min="13"
        max="100">

    </div>


    <div class="field">

      <label>
        WEIGHT
      </label>

      <input
        id="weight"
        type="number"
        value="80"
        min="30"
        max="300">

    </div>


    <div class="field">

      <label>
        HEIGHT
      </label>

      <input
        id="height"
        type="number"
        value="185"
        min="120"
        max="230">

    </div>


    <div class="field full">

      <label>
        ACTIVITY LEVEL
      </label>

      <select id="activity">

        <option value="1.2">
          Sedentary
        </option>

        <option value="1.375">
          Light (1-3 days/wk)
        </option>

        <option value="1.55" selected>
          Moderate (3-5 days/wk)
        </option>

        <option value="1.725">
          High (6-7 days/wk)
        </option>

        <option value="1.9">
          Very high
        </option>

      </select>

    </div>

  </div>


  <button
    class="primary"
    id="calculate">

    Calculate

  </button>

</section>



<!-- ==================================================
     RESULT VIEW
================================================== -->

<section
  class="view hidden"
  id="resultView">


  <div class="result-tabs">

    <div class="tabs">

      <button
        class="tab"
        data-mode="loss">

        Loss

      </button>

      <button
        class="tab active"
        data-mode="maintain">

        Maintain

      </button>

      <button
        class="tab"
        data-mode="gain">

        Gain

      </button>

    </div>

  </div>


  <div class="ring-wrapper">

    <div class="ring">

      <svg viewBox="0 0 200 200">

        <defs>

          <linearGradient
            id="ringGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%">

            <stop
              offset="0%"
              stop-color="#8B5CF6"/>

            <stop
              offset="100%"
              stop-color="#EC4899"/>

          </linearGradient>

        </defs>


        <circle
          class="ring-bg"
          cx="100"
          cy="100"
          r="90"/>


        <circle
          class="ring-progress"
          id="ringProgress"
          cx="100"
          cy="100"
          r="90"/>

      </svg>


      <div class="ring-center">

        <div
          class="calories"
          id="calories">

          2877

        </div>

        <div class="kcal">
          KCAL
        </div>

      </div>

    </div>

  </div>


  <div class="macros">


    <div class="macro">

      <div class="macro-name">

        <div class="dot carbs"></div>

        Carbs

      </div>

      <div class="macro-value">

        <span id="carbs">
          288
        </span>

        <span>g</span>

      </div>

    </div>


    <div class="macro">

      <div class="macro-name">

        <div class="dot protein"></div>

        Protein

      </div>

      <div class="macro-value">

        <span id="protein">
          216
        </span>

        <span>g</span>

      </div>

    </div>


    <div class="macro">

      <div class="macro-name">

        <div class="dot fats"></div>

        Fats

      </div>

      <div class="macro-value">

        <span id="fats">
          96
        </span>

        <span>g</span>

      </div>

    </div>

  </div>


  <div class="result-actions">

    <button
      class="action recalculate"
      id="recalculate">

      Recalculate

    </button>

    <button
      class="action settings-button"
      id="openSettings">

      Settings

    </button>

  </div>

</section>



<!-- ==================================================
     SETTINGS VIEW
================================================== -->

<section
  class="view hidden"
  id="settingsView">


  <div class="settings-title">

    <h2>
      Appearance
    </h2>

    <span>
      Customize widget
    </span>

  </div>


  <!-- ACCENT -->

  <div class="setting">

    <div class="setting-head">

      <div class="setting-name">
        Accent color
      </div>

      <div
        class="setting-value"
        id="colorValue">

        Purple

      </div>

    </div>


    <div class="colors">

      <button
        class="color purple active"
        data-color="purple"
        data-name="Purple">
      </button>

      <button
        class="color pink"
        data-color="pink"
        data-name="Pink">
      </button>

      <button
        class="color blue"
        data-color="blue"
        data-name="Blue">
      </button>

      <button
        class="color green"
        data-color="green"
        data-name="Green">
      </button>

      <button
        class="color orange"
        data-color="orange"
        data-name="Orange">
      </button>

      <button
        class="color cyan"
        data-color="cyan"
        data-name="Cyan">
      </button>

    </div>

  </div>


  <!-- SIZE -->

  <div class="setting">

    <div class="setting-head">

      <div class="setting-name">
        Widget size
      </div>

      <div
        class="setting-value"
        id="sizeValue">

        100%

      </div>

    </div>


    <input
      class="range"
      id="sizeRange"
      type="range"
      min=".82"
      max="1.08"
      step=".01"
      value="1">

  </div>


  <!-- RADIUS -->

  <div class="setting">

    <div class="setting-head">

      <div class="setting-name">
        Corner radius
      </div>

      <div
        class="setting-value"
        id="radiusValue">

        22px

      </div>

    </div>


    <input
      class="range"
      id="radiusRange"
      type="range"
      min="10"
      max="30"
      value="22">

  </div>


  <!-- GLASS -->

  <div class="setting">

    <div class="setting-head">

      <div class="setting-name">
        Glass blur
      </div>

      <div
        class="setting-value"
        id="glassValue">

        15px

      </div>

    </div>


    <input
      class="range"
      id="glassRange"
      type="range"
      min="4"
      max="28"
      value="15">

  </div>


  <div class="settings-actions">

    <button
      class="back"
      id="backToResult">

      Back

    </button>

    <button
      class="save"
      id="saveSettings">

      Save changes

    </button>

  </div>

</section>


</div>



<script>

/* ==================================================
   ELEMENTS
================================================== */

const widget =
  document.getElementById("widget");

const formView =
  document.getElementById("formView");

const resultView =
  document.getElementById("resultView");

const settingsView =
  document.getElementById("settingsView");

const ring =
  document.getElementById("ringProgress");


/* ==================================================
   VIEW SYSTEM
================================================== */

function showView(view){

  [formView,resultView,settingsView]
    .forEach(v =>
      v.classList.add("hidden")
    );

  view.classList.remove("hidden");

  view.classList.remove("animate");

  void view.offsetWidth;

  view.classList.add("animate");
}


/* ==================================================
   CALCULATOR
================================================== */

let currentMode = "maintain";


function calculate(mode){

  const gender =
    document.getElementById("gender").value;

  const age =
    Number(document.getElementById("age").value);

  const weight =
    Number(document.getElementById("weight").value);

  const height =
    Number(document.getElementById("height").value);

  const activity =
    Number(document.getElementById("activity").value);


  if(
    !age ||
    !weight ||
    !height
  ){
    return;
  }


  /* Mifflin-St Jeor */

  let bmr =
    10 * weight +
    6.25 * height -
    5 * age;


  bmr +=
    gender === "male"
      ? 5
      : -161;


  const maintenance =
    bmr * activity;


  let calories;


  if(mode === "loss"){

    calories =
      maintenance * .80;

  }

  else if(mode === "gain"){

    calories =
      maintenance * 1.12;

  }

  else{

    calories =
      maintenance;

  }


  /*
    Macro calculation
  */

  const protein =
    weight * 2.7;

  const fats =
    calories * .30 / 9;

  const carbs =
    Math.max(
      0,
      (
        calories -
        protein * 4 -
        fats * 9
      ) / 4
    );


  document.getElementById(
    "calories"
  ).textContent =
    Math.round(calories)
      .toLocaleString("en-US");


  document.getElementById(
    "protein"
  ).textContent =
    Math.round(protein);


  document.getElementById(
    "carbs"
  ).textContent =
    Math.round(carbs);


  document.getElementById(
    "fats"
  ).textContent =
    Math.round(fats);


  /*
    Ring
  */

  const circumference =
    2 * Math.PI * 90;

  const percentage =
    Math.min(
      calories / 3500,
      1
    );

  const offset =
    circumference -
    circumference * percentage;


  ring.style.strokeDasharray =
    circumference;

  ring.style.strokeDashoffset =
    circumference;


  requestAnimationFrame(()=>{

    ring.style.strokeDashoffset =
      offset;

  });

}


/* ==================================================
   CALCULATE BUTTON
================================================== */

document
  .getElementById("calculate")
  .addEventListener(
    "click",
    ()=>{

      currentMode =
        "maintain";

      document
        .querySelectorAll(".tab")
        .forEach(tab =>
          tab.classList.remove("active")
        );

      document
        .querySelector(
          '[data-mode="maintain"]'
        )
        .classList.add("active");


      calculate("maintain");

      showView(resultView);

    }
  );


/* ==================================================
   RECALCULATE
================================================== */

document
  .getElementById("recalculate")
  .addEventListener(
    "click",
    ()=>{

      showView(formView);

    }
  );


/* ==================================================
   MODE TABS
================================================== */

document
  .querySelectorAll(".tab")
  .forEach(tab => {

    tab.addEventListener(
      "click",
      ()=>{

        currentMode =
          tab.dataset.mode;


        document
          .querySelectorAll(".tab")
          .forEach(t =>
            t.classList.remove("active")
          );


        tab.classList.add("active");


        calculate(currentMode);

      }
    );

  });


/* ==================================================
   SETTINGS
================================================== */

document
  .getElementById("openSettings")
  .addEventListener(
    "click",
    ()=>{

      showView(settingsView);

    }
  );


document
  .getElementById("backToResult")
  .addEventListener(
    "click",
    ()=>{

      showView(resultView);

    }
  );


/* ==================================================
   COLOR SETTINGS
================================================== */

const colorThemes = {

  purple:{
    main:"#8B5CF6",
    secondary:"#EC4899"
  },

  pink:{
    main:"#EC4899",
    secondary:"#8B5CF6"
  },

  blue:{
    main:"#3B82F6",
    secondary:"#8B5CF6"
  },

  green:{
    main:"#22C55E",
    secondary:"#06B6D4"
  },

  orange:{
    main:"#F97316",
    secondary:"#EC4899"
  },

  cyan:{
    main:"#06B6D4",
    secondary:"#3B82F6"
  }

};


document
  .querySelectorAll(".color")
  .forEach(button => {

    button.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".color")
          .forEach(b =>
            b.classList.remove("active")
          );


        button.classList.add("active");


        const theme =
          colorThemes[
            button.dataset.color
          ];


        document.documentElement
          .style.setProperty(
            "--purple",
            theme.main
          );


        document.documentElement
          .style.setProperty(
            "--pink",
            theme.secondary
          );


        document.getElementById(
          "colorValue"
        ).textContent =
          button.dataset.name;

      }
    );

  });


/* ==================================================
   SIZE
================================================== */

document
  .getElementById("sizeRange")
  .addEventListener(
    "input",
    e => {

      const value =
        Number(e.target.value);


      document.documentElement
        .style.setProperty(
          "--scale",
          value
        );


      document.getElementById(
        "sizeValue"
      ).textContent =
        Math.round(value * 100) + "%";

    }
  );


/* ==================================================
   RADIUS
================================================== */

document
  .getElementById("radiusRange")
  .addEventListener(
    "input",
    e => {

      const value =
        e.target.value;


      document.documentElement
        .style.setProperty(
          "--radius",
          value + "px"
        );


      document.getElementById(
        "radiusValue"
      ).textContent =
        value + "px";

    }
  );


/* ==================================================
   GLASS
================================================== */

document
  .getElementById("glassRange")
  .addEventListener(
    "input",
    e => {

      const value =
        e.target.value;


      document.documentElement
        .style.setProperty(
          "--glass",
          value + "px"
        );


      document.getElementById(
        "glassValue"
      ).textContent =
        value + "px";

    }
  );


/* ==================================================
   SAVE SETTINGS
================================================== */

document
  .getElementById("saveSettings")
  .addEventListener(
    "click",
    ()=>{

      localStorage.setItem(
        "calorieWidgetScale",
        document.documentElement
          .style.getPropertyValue(
            "--scale"
          )
      );

      localStorage.setItem(
        "calorieWidgetRadius",
        document.documentElement
          .style.getPropertyValue(
            "--radius"
          )
      );

      localStorage.setItem(
        "calorieWidgetGlass",
        document.documentElement
          .style.getPropertyValue(
            "--glass"
          )
      );


      const button =
        document.getElementById(
          "saveSettings"
        );


      button.textContent =
        "Saved";


      setTimeout(
        ()=>{
          button.textContent =
            "Save changes";
        },
        1000
      );

    }
  );


/* ==================================================
   THEME
================================================== */

document
  .getElementById("themeButton")
  .addEventListener(
    "click",
    ()=>{

      document.body.classList.toggle(
        "light"
      );

    }
  );


/* ==================================================
   LOAD SAVED SETTINGS
================================================== */

const savedScale =
  localStorage.getItem(
    "calorieWidgetScale"
  );

const savedRadius =
  localStorage.getItem(
    "calorieWidgetRadius"
  );

const savedGlass =
  localStorage.getItem(
    "calorieWidgetGlass"
  );


if(savedScale){

  document.documentElement
    .style.setProperty(
      "--scale",
      savedScale
    );

  document.getElementById(
    "sizeRange"
  ).value =
    parseFloat(savedScale);

  document.getElementById(
    "sizeValue"
  ).textContent =
    Math.round(
      parseFloat(savedScale) * 100
    ) + "%";

}


if(savedRadius){

  document.documentElement
    .style.setProperty(
      "--radius",
      savedRadius
    );

  document.getElementById(
    "radiusRange"
  ).value =
    parseInt(savedRadius);

  document.getElementById(
    "radiusValue"
  ).textContent =
    savedRadius;

}


if(savedGlass){

  document.documentElement
    .style.setProperty(
      "--glass",
      savedGlass
    );

  document.getElementById(
    "glassRange"
  ).value =
    parseInt(savedGlass);

  document.getElementById(
    "glassValue"
  ).textContent =
    savedGlass;

}

</script>

</body>
</html>
